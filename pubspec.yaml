version: 0.0.1
homepage:

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.3+1
  document_scan: ^0.4.0
  permission_handler: ^12.0.3
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
